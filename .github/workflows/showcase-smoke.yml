name: Intro showcase browser smoke
on:
  pull_request:
    paths:
      - 'src/showcase.js'
      - 'modules/scenario/**'
      - 'index.html'
      - 'tests/showcase.e2e.cjs'
      - '.github/workflows/showcase-smoke.yml'
permissions:
  contents: read
jobs:
  showcase:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: timeout 180s node tests/showcase.e2e.cjs
